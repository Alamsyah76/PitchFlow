events {}

http {
    upstream frontend {
        server frontend:3070;
    }
    upstream backend {
        server backend:8030;
    }

    server {
        listen 80;
        server_name pitchflow.digital www.pitchflow.digital api.pitchflow.digital;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        server_name pitchflow.digital www.pitchflow.digital;

        ssl_certificate /etc/letsencrypt/live/pitchflow.digital/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pitchflow.digital/privkey.pem;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 443 ssl;
        server_name api.pitchflow.digital;

        ssl_certificate /etc/letsencrypt/live/pitchflow.digital/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pitchflow.digital/privkey.pem;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
